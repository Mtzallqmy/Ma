<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دواء وحياة — التحرير والمراجعة</title><link rel="stylesheet" href="/panel.css"><body><main><header><h1>دواء وحياة · التحرير والمراجعة</h1><button id="language">English</button></header><p id="status" role="status" aria-live="polite"></p><section id="connect" hidden><h2>ربط الهاتف · Connect device</h2><p>وافق فقط إذا فتحت هذه الصفحة بنفسك من تطبيق دواء وحياة. لا توافق على طلب أرسله شخص آخر. Approve only a request you initiated in your app.</p><button id="approve-link">ربط هذا الهاتف · Connect this device</button></section><button id="logout" hidden data-ar="تسجيل الخروج" data-en="Sign out"></button><section id="login"><h2 data-ar="تسجيل الدخول" data-en="Sign in"></h2><form id="login-form"><label><span data-ar="البريد الإلكتروني" data-en="Email"></span><input id="email" type="email" autocomplete="username" required></label><label><span data-ar="كلمة المرور" data-en="Password"></span><input id="password" type="password" autocomplete="current-password" required></label><button data-ar="دخول" data-en="Sign in"></button></form><label><span data-ar="الاسم لإنشاء حساب جديد" data-en="Name for a new account"></span><input id="new-name" autocomplete="name"></label><button id="register" data-ar="إنشاء حساب تعلم" data-en="Create learning account"></button><p data-ar="الحساب لا يمنح صلاحية تحرير تلقائيًا. يلزم إسناد دور من المالك." data-en="An account does not automatically grant editing access. The owner must assign a role."></p></section><section id="workspace" hidden><div class="toolbar"><button id="reload" data-ar="تحديث المسودات" data-en="Reload drafts"></button></div><label><span data-ar="الدرس" data-en="Lesson"></span><select id="lessons"></select></label><p id="revision"></p><form id="editor"><label><span data-ar="العنوان العربي" data-en="Arabic title"></span><input id="title-ar" required></label><label><span data-ar="العنوان الإنجليزي" data-en="English title"></span><input id="title-en" required></label><label><span data-ar="المحتوى العربي" data-en="Arabic content"></span><textarea id="body-ar" rows="12" required></textarea></label><label><span data-ar="المحتوى الإنجليزي" data-en="English content"></span><textarea id="body-en" rows="12" required></textarea></label><button data-ar="حفظ نسخة مسودة جديدة" data-en="Save new draft revision"></button></form><label><span data-ar="ملاحظة المراجعة" data-en="Review note"></span><textarea id="note" rows="3"></textarea></label><div class="toolbar"><button id="review" data-ar="اعتماد مراجعة مستقلة" data-en="Approve independent review"></button><button id="publish" data-ar="نشر النسخة المراجعة" data-en="Publish reviewed revision"></button><button id="withdraw" data-ar="سحب النشر" data-en="Withdraw publication"></button></div><p data-ar="التحرير لا يستبدل النسخة المنشورة حتى اعتماد النسخة الجديدة ونشرها. ترفض قاعدة البيانات المراجعة الذاتية والصلاحيات غير الممنوحة." data-en="Editing keeps the previous publication until a replacement is reviewed and published. The database rejects self-review and unauthorized actions."></p></section><section id="roles" hidden><h2 data-ar="الصلاحيات والتدقيق" data-en="Roles and audit"></h2><form id="role-form"><label>User ID<input id="role-user" required maxlength="256"></label><label>Role<select id="role-value"><option>READ_ONLY</option><option>EDITOR</option><option>REVIEWER</option><option>OWNER</option><option>NONE</option></select></label><button data-ar="حفظ الصلاحية" data-en="Save role"></button></form><button id="audit" data-ar="عرض آخر إجراءات التدقيق" data-en="Show recent audit actions"></button><pre id="audit-result"></pre></section><footer><a href="/privacy" data-ar="الخصوصية" data-en="Privacy"></a></footer></main><script type="module" src="/panel.js"></script></body></html>
