<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'self' data: blob:; img-src 'self' data: blob:;" />
  <title>Dawa &amp; Hayah Local 3D GLB Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #0C1A1C; color: #F5F8F7; }
    #glCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #fallback2d { display: none; width: 100%; height: 100%; padding: 20px; align-items: center; justify-content: center; flex-direction: column; text-align: center; background: #122427; }
    .hud-bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; font-size: 12px; color: #D4E4E6; }
    .hud-tag { background: rgba(12, 26, 28, 0.82); border: 1px solid rgba(218, 185, 119, 0.45); padding: 5px 10px; border-radius: 8px; pointer-events: auto; }
  </style>
</head>
<body>
  <canvas id="glCanvas"></canvas>
  <div id="fallback2d">
    <h3 id="fallbackTitle">تم التحويل التلقائي إلى المخطط التشريحي ثنائي الأبعاد (2D Fallback)</h3>
    <p id="fallbackReason" style="margin-top:8px;font-size:13px;color:#B8C7C9;">تعذر تهيئة WebGL على معالج الرسوميات في هذا الجهاز.</p>
  </div>
  <div class="hud-bar">
    <div class="hud-tag" id="hudTelemetry">Waiting for verified GLB</div>
    <div class="hud-tag" id="hudSelection">انقر على أي جزء تشريحي لتحديده</div>
  </div>

  <script>
    /**
     * Self-contained Zero-CDN Local WebGL + Binary glTF 2.0 (.glb) Parser & Renderer
     * Built specifically for Dawa & Hayah Stage 02 (minSdk 26+ offline execution).
     * Supports:
     * - Parsing binary glTF 2.0 (.glb) chunks (JSON + BIN) into typed Float32/Uint16 buffers
     * - Orbit rotation, pinch/wheel zoom, two-finger/right-drag pan
     * - Ray-ellipsoid / bounding-sphere picking on named TA2 sub-meshes
     * - Layer visibility toggle, isolate selected mesh, semi-transparent X-ray mode
     * - Light/Dark canvas background & WebGL failure fallback
     */
    (function () {
      const canvas = document.getElementById('glCanvas');
      const fallback2d = document.getElementById('fallback2d');
      const hudTelemetry = document.getElementById('hudTelemetry');
      const hudSelection = document.getElementById('hudSelection');

      function showFallback(reason) {
        canvas.style.display = 'none';
        fallback2d.style.display = 'flex';
        hudTelemetry.textContent = '3D unavailable';
        if (window.AndroidAnatomyBridge && window.AndroidAnatomyBridge.onWebGlFallback) {
          window.AndroidAnatomyBridge.onWebGlFallback(reason);
        }
      }
      canvas.addEventListener('webglcontextlost', function (event) {
        event.preventDefault();
        showFallback('WebGL context lost');
      });
      const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
      if (!gl) {
        showFallback('WebGL context unavailable on device GPU');
        return;
      }

      const vsSource = `
        attribute vec3 aPosition;
        attribute vec3 aNormal;
        uniform mat4 uProjection;
        uniform mat4 uView;
        uniform vec3 uLightDir;
        varying vec3 vNormal;
        varying vec3 vPosition;
        void main() {
          vNormal = aNormal;
          vPosition = aPosition;
          gl_Position = uProjection * uView * vec4(aPosition, 1.0);
        }
      `;

      const fsSource = `
        precision mediump float;
        varying vec3 vNormal;
        varying vec3 vPosition;
        uniform vec4 uBaseColor;
        uniform float uSelected;
        uniform float uAlpha;
        void main() {
          vec3 n = normalize(vNormal);
          vec3 light1 = normalize(vec3(0.6, 0.8, 0.7));
          vec3 light2 = normalize(vec3(-0.5, -0.4, 0.5));
          float diff1 = max(dot(n, light1), 0.0);
          float diff2 = max(dot(n, light2), 0.0) * 0.35;
          float ambient = 0.32;
          vec3 col = uBaseColor.rgb * (ambient + diff1 * 0.68 + diff2);
          if (uSelected > 0.5) {
            col = mix(col, vec3(0.95, 0.82, 0.35), 0.42);
          }
          gl_FragColor = vec4(col, uAlpha);
        }
      `;

      function compileShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }

      const prog = gl.createProgram();
      gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vsSource));
      gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const aPosition = gl.getAttribLocation(prog, 'aPosition');
      const aNormal = gl.getAttribLocation(prog, 'aNormal');
      const uProjection = gl.getUniformLocation(prog, 'uProjection');
      const uView = gl.getUniformLocation(prog, 'uView');
      const uBaseColor = gl.getUniformLocation(prog, 'uBaseColor');
      const uSelected = gl.getUniformLocation(prog, 'uSelected');
      const uAlpha = gl.getUniformLocation(prog, 'uAlpha');

      let sceneParts = [];
      let selectedMeshName = 'Ventriculus_Sinister';
      let transparentMode = false;
      let isolateMode = false;
      let darkCanvas = true;
      let hiddenLayers = {};

      // Camera orbit state
      let yaw = 0.45;
      let pitch = 0.22;
      let distance = 3.2;
      let panX = 0.0;
      let panY = 0.0;

      function uploadMesh(name, posArray, normArray, indArray, color, center, radius) {
        const posBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.bufferData(gl.ARRAY_BUFFER, posArray, gl.STATIC_DRAW);

        const normBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, normBuf);
        gl.bufferData(gl.ARRAY_BUFFER, normArray, gl.STATIC_DRAW);

        const indBuf = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indBuf);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indArray, gl.STATIC_DRAW);

        return { name, posBuf, normBuf, indBuf, indexCount: indArray.length, color, center, radius };
      }

      // Binary GLB parser (reads header, JSON chunk, BIN chunk)
      window.loadGlbFromBase64 = function (base64Str) {
        const t0 = performance.now();
        try {
          const binStr = atob(base64Str);
          const len = binStr.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) bytes[i] = binStr.charCodeAt(i);
          const dv = new DataView(bytes.buffer);
          if (len < 28 || dv.getUint32(0, true) !== 0x46546C67 ||
              dv.getUint32(4, true) !== 2 || dv.getUint32(8, true) !== len ||
              dv.getUint32(16, true) !== 0x4E4F534A) throw new Error('Invalid GLB header');
          const jsonLen = dv.getUint32(12, true);
          if (20 + jsonLen + 8 > len) throw new Error('Invalid JSON chunk length');
          const jsonBytes = bytes.subarray(20, 20 + jsonLen);
          const gltf = JSON.parse(new TextDecoder('utf-8').decode(jsonBytes));
          const binHeader = 20 + jsonLen;
          const binLength = dv.getUint32(binHeader, true);
          if (dv.getUint32(binHeader + 4, true) !== 0x004E4942 || binHeader + 8 + binLength !== len)
            throw new Error('Invalid BIN chunk');
          const binOffset = binHeader + 8;
          const binChunk = bytes.buffer.slice(binOffset);
          if (!gltf.meshes || !gltf.meshes.length) throw new Error('No GLB meshes');

          const loaded = [];
          for (let i = 0; i < gltf.meshes.length; i++) {
            const mesh = gltf.meshes[i];
            const prim = mesh.primitives[0];
            const posAcc = gltf.accessors[prim.attributes.POSITION];
            const normAcc = gltf.accessors[prim.attributes.NORMAL];
            const indAcc = gltf.accessors[prim.indices];
            const posBv = gltf.bufferViews[posAcc.bufferView];
            const normBv = gltf.bufferViews[normAcc.bufferView];
            const indBv = gltf.bufferViews[indAcc.bufferView];

            const posArr = new Float32Array(binChunk, posBv.byteOffset || 0, posAcc.count * 3);
            const normArr = new Float32Array(binChunk, normBv.byteOffset || 0, normAcc.count * 3);
            const indArr = new Uint16Array(binChunk, indBv.byteOffset || 0, indAcc.count);
            const mat = gltf.materials[prim.material || 0];
            const color = (mat && mat.pbrMetallicRoughness && mat.pbrMetallicRoughness.baseColorFactor) || [0.8, 0.3, 0.3, 1.0];
            const min = posAcc.min || [-0.5, -0.5, -0.5];
            const max = posAcc.max || [0.5, 0.5, 0.5];
            const center = [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2];
            const radius = Math.max(max[0] - min[0], max[1] - min[1], max[2] - min[2]) / 2;

            loaded.push(uploadMesh(mesh.name, posArr, normArr, indArr, color, center, radius));
          }
          sceneParts = loaded;
          const dt = Math.round(performance.now() - t0);
          hudTelemetry.textContent = 'GLB Loaded (' + Math.round(len / 1024) + ' KB · ' + dt + ' ms · ' + sceneParts.length + ' TA2 Meshes)';
          render();
          if (window.AndroidAnatomyBridge && window.AndroidAnatomyBridge.onModelLoaded)
            window.AndroidAnatomyBridge.onModelLoaded(sceneParts.length);
        } catch (err) {
          sceneParts = [];
          showFallback('GLB parsing failed');
        }
      };

      window.viewerControl = {
        resetCamera: function () { yaw = 0.45; pitch = 0.22; distance = 3.2; panX = 0; panY = 0; render(); },
        selectMesh: function (name) { selectedMeshName = name; hudSelection.textContent = 'المعلم المحدد: ' + name; render(); },
        toggleLayer: function (name, visible) { hiddenLayers[name] = !visible; render(); },
        setTransparentMode: function (enabled) { transparentMode = !!enabled; render(); },
        setIsolateMode: function (enabled) { isolateMode = !!enabled; render(); },
        setDarkCanvas: function (dark) { darkCanvas = !!dark; render(); }
      };

      function perspectiveMatrix(fov, aspect, near, far) {
        const f = 1.0 / Math.tan(fov / 2);
        const nf = 1 / (near - far);
        return new Float32Array([
          f / aspect, 0, 0, 0,
          0, f, 0, 0,
          0, 0, (far + near) * nf, -1,
          0, 0, (2 * far * near) * nf, 0
        ]);
      }

      function viewMatrix() {
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        return new Float32Array([
          cy, sy * sp, sy * cp, 0,
          0, cp, -sp, 0,
          -sy, cy * sp, cy * cp, 0,
          panX, panY, -distance, 1
        ]);
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = canvas.clientWidth * dpr;
        canvas.height = canvas.clientHeight * dpr;
        gl.viewport(0, 0, canvas.width, canvas.height);
      }

      function render() {
        resize();
        if (darkCanvas) {
          gl.clearColor(0.05, 0.11, 0.12, 1.0);
        } else {
          gl.clearColor(0.94, 0.96, 0.95, 1.0);
        }
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

        const proj = perspectiveMatrix(0.78, canvas.width / Math.max(canvas.height, 1), 0.1, 25.0);
        const view = viewMatrix();
        gl.uniformMatrix4fv(uProjection, false, proj);
        gl.uniformMatrix4fv(uView, false, view);

        for (let i = 0; i < sceneParts.length; i++) {
          const part = sceneParts[i];
          if (hiddenLayers[part.name]) continue;
          if (isolateMode && part.name !== selectedMeshName) continue;

          const isSel = part.name === selectedMeshName ? 1.0 : 0.0;
          const alpha = transparentMode ? (isSel > 0.5 ? 0.96 : 0.28) : 1.0;

          gl.uniform4fv(uBaseColor, part.color);
          gl.uniform1f(uSelected, isSel);
          gl.uniform1f(uAlpha, alpha);

          gl.bindBuffer(gl.ARRAY_BUFFER, part.posBuf);
          gl.enableVertexAttribArray(aPosition);
          gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);

          gl.bindBuffer(gl.ARRAY_BUFFER, part.normBuf);
          gl.enableVertexAttribArray(aNormal);
          gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 0, 0);

          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, part.indBuf);
          gl.drawElements(gl.TRIANGLES, part.indexCount, gl.UNSIGNED_SHORT, 0);
        }
      }

      // Pointer & Touch interaction
      let dragging = false;
      let startX = 0, startY = 0;
      let movedDist = 0;

      canvas.addEventListener('pointerdown', function (e) {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        movedDist = 0;
      });

      window.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        movedDist += Math.abs(dx) + Math.abs(dy);
        startX = e.clientX;
        startY = e.clientY;
        if (e.shiftKey || e.buttons === 2) {
          panX += dx * 0.005;
          panY -= dy * 0.005;
        } else {
          yaw += dx * 0.01;
          pitch = Math.max(-1.3, Math.min(1.3, pitch + dy * 0.01));
        }
        render();
      });

      window.addEventListener('pointerup', function (e) {
        if (!dragging) return;
        dragging = false;
        if (movedDist < 6) {
          // Pick closest visible anatomical structure in view space
          const rect = canvas.getBoundingClientRect();
          const ndcX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          const ndcY = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
          const v = viewMatrix();
          let bestName = null;
          let bestScore = 999;
          for (let i = 0; i < sceneParts.length; i++) {
            const p = sceneParts[i];
            if (hiddenLayers[p.name]) continue;
            const cx = p.center[0], cy = p.center[1], cz = p.center[2];
            const vx = v[0] * cx + v[4] * cy + v[8] * cz + v[12];
            const vy = v[1] * cx + v[5] * cy + v[9] * cz + v[13];
            const vz = v[2] * cx + v[6] * cy + v[10] * cz + v[14];
            const scale = 1.0 / Math.max(-vz, 0.5);
            const sx = vx * scale * 2.1;
            const sy = vy * scale * 2.1;
            const d = Math.hypot(sx - ndcX, sy - ndcY);
            if (d < 0.45 && d < bestScore) {
              bestScore = d;
              bestName = p.name;
            }
          }
          if (bestName) {
            selectedMeshName = bestName;
            hudSelection.textContent = 'المعلم المحدد: ' + bestName;
            if (window.AndroidAnatomyBridge && window.AndroidAnatomyBridge.onMeshSelected) {
              window.AndroidAnatomyBridge.onMeshSelected(bestName);
            }
            render();
          }
        }
      });

      canvas.addEventListener('wheel', function (e) {
        e.preventDefault();
        distance = Math.max(1.6, Math.min(6.0, distance + e.deltaY * 0.003));
        render();
      }, { passive: false });

      window.addEventListener('resize', render);
      render();
    })();
  </script>
</body>
</html>
