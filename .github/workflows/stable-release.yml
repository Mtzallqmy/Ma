name: Dawa Hayah — gated permanent-signing v1.0.0
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: permanent-stable-release
  cancel-in-progress: false
jobs:
  stable:
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 45
    env:
      CLINICAL_REVIEW_APPROVED_SHA: ${{ secrets.CLINICAL_REVIEW_APPROVED_SHA }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require actual stable-release approvals and permanent secrets
        run: python3 scripts/check-stable-release.py
      - name: Require successful Android quality workflow for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100" > "$RUNNER_TEMP/quality.json"
          python3 - "$RUNNER_TEMP/quality.json" <<'PY'
          import json,sys
          runs=json.load(open(sys.argv[1]))['workflow_runs']
          assert any(r['name']=='Dawa & Hayah — Android CI & ARM64 Build Check' and r['conclusion']=='success' for r in runs), 'Quality gates have not passed for this commit'
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint, and assemble approved release
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -PAPP_VERSION_NAME=1.0.0 -PAPP_VERSION_CODE=100 --stacktrace
      - name: Decode permanent signing key into runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Sign with permanent key and verify intended package
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK_UNSIGNED=$(find app/build/outputs/apk/release -maxdepth 1 -name '*unsigned.apk' | head -1)
          test -s "$APK_UNSIGNED"
          mkdir -p dist
          "$TOOLS/zipalign" -f -p 4 "$APK_UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS" --ks-pass env:ANDROID_RELEASE_STORE_PASSWORD --key-pass env:ANDROID_RELEASE_KEY_PASSWORD --out dist/Dawa-Hayah-v1.0.0-android8-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs dist/*.apk > dist/SIGNATURE.txt
          if grep -Eiq "Android Debug|Temporary Beta Test|Temporary.*Test" dist/SIGNATURE.txt; then echo "Test certificate cannot sign a stable release"; exit 1; fi
          "$TOOLS/aapt" dump badging dist/*.apk > dist/APK-METADATA.txt
          python3 scripts/verify-release-apk.py dist/Dawa-Hayah-v1.0.0-android8-arm64.apk 1.0.0
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > dist/DEPENDENCIES.txt
          python3 scripts/apk-sbom.py dist/Dawa-Hayah-v1.0.0-android8-arm64.apk > dist/SBOM.spdx.json
          cp release/readiness.json dist/READINESS.json
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish stable only after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.0 dist/* --target "$GITHUB_SHA" --title "Dawa & Hayah 1.0.0" --notes-file release/CHANGELOG.md
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"
