name: Import attributed OpenStax anatomical plate
on:
  push:
    branches: ["feat/dawa-hayah-real-production-overhaul"]
    paths: ["scripts/import-openstax-heart.py", ".github/workflows/import-licensed-anatomy.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire original licensed bytes and record provenance
        run: python3 scripts/import-openstax-heart.py
      - name: Save licensed asset on the requested work branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/anatomy/
          if ! git diff --cached --quiet; then
            git commit -m "data(anatomy): import unchanged OpenStax heart plate with CC BY 3.0 attribution"
            git push origin HEAD:feat/dawa-hayah-real-production-overhaul
          fi
