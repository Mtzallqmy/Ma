name: Dawa & Hayah — Android CI & ARM64 Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/dawa-hayah-real-production-overhaul"
      - "ai-studio/stage-**"
      - "work/stage-**"
      - "integration/stage03-**"
  pull_request:
    branches:
      - main

concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint-test-and-build:
    name: Android Quality Gate (Security + JVM Tests + Lint + Debug Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify release gates and APK inventory tooling
        run: python3 scripts/test-release-gates.py

      - name: Security Scan — Verify No Exposed Neon or S3 Secrets
        run: |
          if grep -RInE "(postgresql://.*:.*@|AWS_SECRET_ACCESS_KEY\s*=\s*\"[^\"]+\"|NEON_API_KEY\s*=\s*\"[^\"]+\")" app/src/main/; then
            echo "CRITICAL: Hardcoded cloud secret detected inside Android production source tree!"
            exit 1
          fi
          echo "Security check passed: zero hardcoded secrets in app/src/main/ (test fixtures excluded)."

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned API dependencies for contract tests
        run: npm ci --ignore-scripts --prefix neon/functions/public-api
      - name: Audit production API dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: neon/functions/public-api
      - name: Build browser and server bundles
        run: node build.mjs
        working-directory: neon/functions/public-api
      - name: Published API snapshot contract tests
        run: node --test neon/functions/public-api/*.test.js

      - name: Run Kotlin Unit Tests (Search Normalizer, SHA-256 Verifier, Pack Manager)
        run: ./gradlew :app:testDebugUnitTest --stacktrace --info

      - name: Upload JVM Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dawa-hayah-jvm-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble Internal Debug APK (For Stage 01 Verification Only — No Public Beta)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Internal Verification Artifact (Not for Public Distribution)
        uses: actions/upload-artifact@v4
        with:
          name: dawa-hayah-stage01-internal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  offline-device-tests:
    name: Offline SQLite and pack installation (API ${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-api${{ matrix.api }}-test-reports
          path: app/build/reports/androidTests/connected/
